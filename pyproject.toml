[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenpowerbench"
version = "1.0.0"
description = "Measure LLM inference power, energy, and prefill/decode timing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nvidia-ml-py>=12.0.0",
]
keywords = ["LLM", "inference", "energy", "power", "benchmark"]

[project.urls]
Homepage = "https://github.com/chenxuniu/TokenPowerBench"
Documentation = "https://github.com/chenxuniu/TokenPowerBench#readme"
Repository = "https://github.com/chenxuniu/TokenPowerBench"
Issues = "https://github.com/chenxuniu/TokenPowerBench/issues"
Paper = "https://doi.org/10.1609/aaai.v40i38.40535"

[project.optional-dependencies]
vllm = ["vllm>=0.10.1,<0.11"]
datasets = ["datasets>=2.0.0"]
distributed = [
    "vllm>=0.10.1,<0.11",
    "ray[cgraph]>=2.43.0",
    "numpy>=1.24.0",
    "packaging>=21.0",
    "datasets>=2.0.0",
]

[project.scripts]
tokenpowerbench = "tokenpowerbench.cli:main"
tpbench-single = "tokenpowerbench.cli:main"
tpbench-multi  = "run_multi_node:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenpowerbench*"]

[tool.setuptools]
py-modules = ["run_single_node", "run_multi_node"]
